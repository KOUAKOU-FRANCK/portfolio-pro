<html lang="fr">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0b1d3a" />
    <!-- Vérification Google Search Console : ne pas supprimer. -->
    <meta name="google-site-verification" content="JHQZAKD737iHsghYjZj2GiJyKzWFc3e2GwAFVZxSE_E" />

    <title>Kouakou Kouadio Franck — Informatique & Photographie</title>
    <meta
      name="description"
      content="Kouakou Kouadio Franck, technicien supérieur en informatique : gestion de projets IT, développement d'applications, cybersécurité et intelligence artificielle. Également photographe événementiel."
    />

    <!-- Aperçu des liens partagés (WhatsApp, LinkedIn, Facebook).
         Ces balises doivent rester ici : les réseaux sociaux n'exécutent pas le JavaScript.
         Titre, description et adresse de chaque page sont remplacés au build depuis src/data/pages.js.
         __SITE__ est remplacé par l'adresse du site (SITE dans src/data/pages.js).
         Image de partage : public/images/partage.png (1200×630), à remplacer si vous le souhaitez. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Kouakou Kouadio Franck — Informatique & Photographie" />
    <meta
      property="og:description"
      content="Je transforme les idées en solutions innovantes : gestion de projets IT, développement d'applications, cybersécurité et intelligence artificielle."
    />
    <meta property="og:url" content="__SITE__/" />
    <meta property="og:image" content="__SITE__/images/partage.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="__SITE__/" />

    <!-- Données structurées (profil + activité photo), générées depuis src/data/profile.js par plugins/seo.js. -->
    <!-- donnees-structurees -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
